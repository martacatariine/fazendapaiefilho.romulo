<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fazenda Pai e Filho</title>
<meta name="description" content="Gestão da fazenda: uva, custos, estoque, produção, pulverização e financeiro">
<meta name="theme-color" content="#6A2C5B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fazenda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>
<style>
/* Layout: cabeçalho da fazenda + faixa de abas roláveis; cada aba é uma folha de trabalho com resumo em cima e lista embaixo */
:root{
  --bg:#F3F5F0; --surface:#FFFFFF; --sunk:#E8ECE4; --line:#D6DCD0;
  --ink:#1D231F; --muted:#5E6A61;
  --grape:#6A2C5B; --grape-soft:#F1E6EE; --leaf:#2F6E45; --leaf-soft:#E2EFE5;
  --warn:#9A5B00; --warn-soft:#FBF0DC; --bad:#A3312A; --bad-soft:#F8E3E1;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141814; --surface:#1C211D; --sunk:#232924; --line:#323A33;
  --ink:#E8ECE6; --muted:#A1ACA3;
  --grape:#D69AC6; --grape-soft:#3A2335; --leaf:#7CC394; --leaf-soft:#1F3427;
  --warn:#E8B45C; --warn-soft:#3A2D16; --bad:#F08A80; --bad-soft:#3E201D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141814; --surface:#1C211D; --sunk:#232924; --line:#323A33;
  --ink:#E8ECE6; --muted:#A1ACA3;
  --grape:#D69AC6; --grape-soft:#3A2335; --leaf:#7CC394; --leaf-soft:#1F3427;
  --warn:#E8B45C; --warn-soft:#3A2D16; --bad:#F08A80; --bad-soft:#3E201D; color-scheme:dark}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--grape);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:20px 12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 260px}
.brand svg{flex:none}
.brand small{display:block;color:var(--muted);font-size:.85rem}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sync{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--leaf)} .sync.local i{background:var(--warn)}
select.yr{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs-in{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:1180px;margin:0 auto}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:12px 12px 10px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;font-weight:700;font-size:.95rem;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--grape);border-bottom-color:var(--grape)}

main{padding-top:20px;display:grid;gap:20px}
.sec{display:grid;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.sec-h p{margin:2px 0 0;color:var(--muted);font-size:.9rem;max-width:62ch}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.92rem}
.btn:hover{border-color:var(--grape)}
.btn.pri{background:var(--grape);border-color:var(--grape);color:var(--surface)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}

/* resumo do painel */
.verdict{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:6px}
.verdict .big{font-family:var(--display);font-size:clamp(1.9rem,6vw,2.8rem);line-height:1.05;font-weight:700}
.verdict .big.pos{color:var(--leaf)} .verdict .big.neg{color:var(--bad)}
.verdict p{margin:0;color:var(--muted);max-width:64ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:2px;align-content:start}
.kpi .l{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.kpi .v{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.82rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0;align-content:start}

.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:.92rem}
.alert b.tag{flex:none;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.alert.bad{background:var(--bad-soft)} .alert.bad b.tag{background:var(--bad);color:var(--surface)}
.alert.warn{background:var(--warn-soft)} .alert.warn b.tag{background:var(--warn);color:var(--surface)}
.alert.ok{background:var(--leaf-soft)} .alert.ok b.tag{background:var(--leaf);color:var(--surface)}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunk);position:sticky;top:0}
td.n,th.n{text-align:right}
td.wrap{white-space:normal;min-width:180px}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--sunk)}
tfoot td{font-weight:700;background:var(--sunk);border-bottom:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--leaf-soft);color:var(--leaf)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.grape{background:var(--grape-soft);color:var(--grape)}
.ex{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--muted);padding:0 5px;border-radius:4px;margin-left:6px}
.pos{color:var(--leaf)} .neg{color:var(--bad)}

.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:.88rem}
.bar .track{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--grape);border-radius:6px}
.bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:.9rem}
.note{font-size:.85rem;color:var(--muted);margin:0}

dialog{border:0;border-radius:14px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,24,20,.45)}
.dlg{display:grid;grid-template-rows:auto 1fr auto;max-height:calc(100dvh - 24px)}
.dlg-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-b{padding:16px 18px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fld{display:grid;gap:4px;grid-column:span 2;min-width:0}
.fld.half{grid-column:span 1}
@media (max-width:520px){.fld.half{grid-column:span 2}}
.fld label{font-weight:700;font-size:.88rem}
.fld .hint{font-size:.8rem;color:var(--muted)}
.fld input,.fld select,.fld textarea{padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%;box-sizing:border-box}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--grape);outline:none;box-shadow:0 0 0 3px var(--grape-soft)}
.calc{grid-column:span 2;background:var(--grape-soft);border-radius:8px;padding:10px 12px;font-size:.92rem}
.x{border:0;background:none;font-size:1.4rem;cursor:pointer;color:var(--muted);line-height:1}
.err{color:var(--bad);font-size:.85rem;align-self:center}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .4s ease}}
.gate{min-height:calc(100dvh - 48px);display:grid;place-items:center;padding-block:24px}
.gate-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:14px;box-sizing:border-box}
.gate-card .brand{flex:none}
.gate-card .fld{grid-column:auto}
.gate-card .btn.pri{width:100%;padding:12px}
.who{font-size:.85rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dlg-meta{font-size:.78rem;color:var(--muted);align-self:center}
dialog.wide{width:min(980px,calc(100vw - 24px))}
.imp-b{padding:16px 18px;overflow-y:auto;display:grid;gap:16px}
.nf{border:1px solid var(--line);border-radius:var(--r);display:grid;gap:10px;padding:14px;min-width:0}
.nf.dup{opacity:.6}
.nf-h{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.nf-h b{font-family:var(--display);font-size:1.05rem}
.nf-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.nf-opts label,.mini{display:grid;gap:3px;font-size:.78rem;font-weight:700;color:var(--muted)}
.nf select,.nf input,.mini input,.mini select{padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:.88rem;width:100%;box-sizing:border-box;color:var(--ink)}
.nf td{vertical-align:middle}
.nf td input,.nf td select{min-width:110px}
.chk{display:flex;gap:8px;align-items:center;font-weight:700;font-size:.9rem}
.chk input{width:18px;height:18px}
.grid-dia{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
</style>
</head>
<body>


<section class="gate" id="gate"><form class="gate-card" id="gateForm" novalidate><div class="empty">Carregando…</div></form></section>

<div class="wrap" id="app" hidden>
<header class="top">
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M20 4 C22 8 26 9 29 8" stroke="var(--leaf)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <g fill="var(--grape)"><circle cx="14" cy="15" r="5"/><circle cx="25" cy="15" r="5"/><circle cx="19.5" cy="23" r="5"/><circle cx="9" cy="23" r="4.2"/><circle cx="30" cy="23" r="4.2"/><circle cx="14.5" cy="31" r="4.4"/><circle cx="24.5" cy="31" r="4.4"/></g>
    </svg>
    <div style="min-width:0"><h1 id="farmName">Fazenda Pai e Filho</h1><small>Gestão da fazenda: uva, custos, embalagens e dinheiro</small></div>
  </div>
  <div class="tools">
    <span class="who"><span id="who"></span><button class="btn sm" id="sair" type="button">Sair</button></span>
    <label class="sync" id="sync"><i></i><span>Conectando…</span></label>
    <label for="ano" class="sync">Período</label>
    <select id="ano" class="yr"></select>
  </div>
</header>
<nav class="tabs" aria-label="Seções"><div class="tabs-in" role="tablist" id="tabs"></div></nav>
<div id="banner"></div>
<main id="view"></main>
</div>

<dialog id="dlg"><form class="dlg" id="frm" novalidate>
  <div class="dlg-h"><h2 id="dlgT">Lançamento</h2><button type="button" class="x" id="dlgX" aria-label="Fechar">×</button></div>
  <div class="dlg-b" id="dlgB"></div>
  <div class="dlg-f"><div class="btns"><button type="button" class="btn danger" id="dlgDel" hidden>Excluir</button><span class="err" id="dlgErr"></span><span class="dlg-meta" id="dlgMeta"></span></div>
  <div class="btns"><button type="button" class="btn" id="dlgC">Cancelar</button><button type="submit" class="btn pri" id="dlgS">Salvar</button></div></div>
</form></dialog>

<input type="file" id="xmlIn" accept=".xml,text/xml,application/xml" multiple hidden>
<input type="file" id="ofxIn" accept=".ofx,.OFX,application/x-ofx,text/plain" hidden>
<input type="file" id="bkIn" accept=".json,application/json" hidden>
<dialog id="imp" class="wide"><form class="dlg" id="impF" novalidate>
  <div class="dlg-h"><h2 id="impT">Importar notas (XML)</h2><button type="button" class="x" data-close-imp aria-label="Fechar">×</button></div>
  <div class="imp-b" id="impB"></div>
  <div class="dlg-f"><span class="err" id="impErr"></span><div class="btns"><button type="button" class="btn" data-close-imp>Cancelar</button><button type="submit" class="btn pri" id="impS">Importar</button></div></div>
</form></dialog>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
(()=>{
/* ---------- estado ---------- */
const COLS=['talhoes','custos','envios','pcs','embalagens','movfin','insumos','producao','pulverizacoes','equipe','notasxml','contas','extrato'];
const S={acesso:[]}; COLS.forEach(c=>S[c]=[]);
let CFG={saldoInicial:0,dataSaldo:'',minimos:{},fazenda:'Fazenda Pai e Filho'};
let db=null, local=false, canWrite=false, dl=null, loaded=new Set();
let serverWrite=true, serverAdmin=false, sessao=null, acessoOk=false, falhas=0, bloqueioAte=0;
let view='inicio', ano=String(new Date().getFullYear()), finTab='pagar', finFiltro='abertas';
const LKEY='fazenda-romulo-erp-v1';

/* ---------- formatação ---------- */
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const NUM=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2});
const INT=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
const brl=v=>BRL.format(v||0), num=v=>NUM.format(v||0), int=v=>INT.format(v||0);
const fd=d=>d?d.split('-').reverse().join('/'):'—';
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDias=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const fm=k=>{const[y,m]=k.split('-');return MES[+m-1]+'/'+y.slice(2)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pBR=v=>{if(v===''||v==null)return 0;if(typeof v==='number')return v;let s=String(v).trim().replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return isFinite(n)?n:NaN};
const sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const inAno=d=>ano==='todos'||String(d||'').startsWith(ano);
function semanaISO(iso){if(!iso)return'';const d=new Date(iso+'T12:00:00');const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)}

/* ---------- cálculos ---------- */
const tNome=id=>(S.talhoes.find(t=>t.id===id)||{}).nome||(id?'(lote removido)':'Fazenda toda');
function pc(p){const b=+p.valorBruto||0,tx=+p.taxaCoop||0,fr=+p.frete||0,im=+p.impostos||0,ou=+p.outros||0,ins=+p.insumos||0;
  return{bruto:b,descTotal:tx+fr+im+ou+ins,liquido:b-tx-fr-im-ou-ins,receita:b-tx-fr-im-ou,kg:+p.kgAprovado||0,pago:p.status==='Pago'}}
const pcData=p=>p.dataFim||p.dataInicio||p.dataPagamento;
const ehCaixaCusto=c=>c.forma!=='Descontado na PC';
function estoqueDe(movs,usos,mins){const m={};const g=k=>m[k]||(m[k]={item:k,ent:0,sai:0,uso:0,aj:0,un:''});
  movs.forEach(e=>{if(!e.item)return;const r=g(e.item);const q=+e.qtd||0;if(e.unidade)r.un=e.unidade;if(e.tipo==='Entrada')r.ent+=q;else if(e.tipo==='Saída')r.sai+=q;else r.aj+=q});
  usos.forEach(([k,q])=>{if(k)g(k).uso+=(+q||0)});
  Object.keys(mins||{}).forEach(k=>g(k));
  return Object.values(m).map(r=>({...r,saldo:r.ent-r.sai-r.uso+r.aj,min:+((mins||{})[r.item])||0})).sort((a,b)=>a.item.localeCompare(b.item))}
const estoque=()=>estoqueDe(S.embalagens,S.envios.map(e=>[e.embalagem,e.caixas]),CFG.minimos);
const usosPulv=()=>S.pulverizacoes.flatMap(p=>[[p.produto1,p.qtd1],[p.produto2,p.qtd2],[p.produto3,p.qtd3]]);
const estoqueIns=()=>estoqueDe(S.insumos,usosPulv(),CFG.minimosIns);
const pNome=id=>(S.equipe.find(e=>e.id===id)||{}).nome||(id?'(removido)':'—');
const equipeOpts=fn=>()=>[['','— escolha —'],...S.equipe.filter(e=>e.funcao===fn&&e.ativo!=='Não').map(e=>[e.id,e.nome])];
function carencias(ref){const d=ref||hoje();const out=[];
  S.talhoes.forEach(t=>{const ps=S.pulverizacoes.filter(p=>p.talhao===t.id&&p.data&&+p.carencia>0).map(p=>({p,lib:addDias(p.data,+p.carencia)})).filter(x=>x.lib>d&&x.p.data<=d).sort((a,b)=>b.lib.localeCompare(a.lib));
    if(ps.length)out.push({t,lib:ps[0].lib,p:ps[0].p})});return out}
const prodsPulv=p=>[p.produto1,p.produto2,p.produto3].filter(Boolean).join(' + ');
function resumo(){
  const cs=S.custos.filter(c=>inAno(c.data)), es=S.envios.filter(e=>inAno(e.data)), ps=S.pcs.filter(p=>inAno(pcData(p)));
  const custo=sum(cs,c=>c.valor), dir=sum(cs.filter(c=>c.classe==='Direto'),c=>c.valor);
  const receita=sum(ps,p=>pc(p).receita), recebido=sum(ps,p=>(titulo('pcs',p)||{}).pago||0), aReceber=sum(S.pcs,p=>(titulo('pcs',p)||{}).saldo||0);
  const kg=sum(es,e=>e.kg), cx=sum(es,e=>e.caixas), kgPC=sum(ps,p=>p.kgAprovado);
  return{cs,es,ps,custo,dir,ind:custo-dir,receita,recebido,aReceber,kg,cx,kgPC,res:receita-custo,
    precoKg:kgPC?receita/kgPC:(kg?receita/kg:0),custoKg:kg?custo/kg:0,custoCx:cx?custo/cx:0}}
function porTalhao(R){
  const tal=S.talhoes; const area=sum(tal,t=>t.area); const kgT=R.kg;
  const pool=sum(R.cs.filter(c=>c.classe!=='Direto'||!c.talhao),c=>c.valor);
  const precoKgEnv=R.kg?R.receita/R.kg:0;
  return tal.map(t=>{const kg=sum(R.es.filter(e=>e.talhao===t.id),e=>e.kg);
    const dir=sum(R.cs.filter(c=>c.classe==='Direto'&&c.talhao===t.id),c=>c.valor);
    const share=area?(+t.area||0)/area:(kgT?kg/kgT:(tal.length?1/tal.length:0));
    const ind=pool*share, rec=kg*precoKgEnv;
    return{t,kg,dir,ind,rec,res:rec-dir-ind,ckg:kg?(dir+ind)/kg:0}})}

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* Com o banco offline do Firestore, a gravação fica na fila do aparelho e sobe quando a internet volta.
   Esperamos a confirmação do servidor por pouco tempo; se demorar, seguimos e avisamos se falhar depois. */
async function grava(p){let ok=false;const w=p.then(()=>{ok=true}).catch(e=>{if(!ok)throw e});
  const r=await Promise.race([w.then(()=>'ok'),new Promise(res=>setTimeout(()=>res('fila'),1500))]);
  if(r==='fila'){setSync('local','Sem internet: salvo no aparelho');w.then(()=>setSync('ok','Salvo na nuvem')).catch(e=>showBanner('Uma gravação foi recusada pelo servidor ('+(e.code||e.message)+').'))}}
async function put(col,obj){const {id,...data}=obj;
  if(col!=='acesso'){data.por=sessao?.u||'';data.porNome=sessao?.nome||'';data.em=new Date().toISOString()}
  const ref=id?db.collection(fcol(col)).doc(id):db.collection(fcol(col)).doc();await grava(ref.set(data))}
async function del(col,id){await grava(db.collection(fcol(col)).doc(id).delete())}
async function putCfg(patch){CFG={...CFG,...patch};await grava(db.doc('config/geral').set(CFG))}
function setSync(mode,txt){const el=document.getElementById('sync');el.className='sync '+mode;el.querySelector('span').textContent=txt}
let fb=null,subs=[];
function baixarArquivo({filename,data}){const blob=data instanceof Blob?data:new Blob([data]);const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},2000);return Promise.resolve({status:'saved'})}
async function init(){
  dl={save:baixarArquivo};
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey||/COLE/.test(cfg.apiKey)){acessoOk=true;document.getElementById('gateForm').innerHTML=`<div class="brand">${LOGO}<div><h1>${esc(CFG.fazenda)}</h1><small>Configuração pendente</small></div></div><p class="note">O sistema ainda não está ligado ao banco de dados. Preencha o arquivo <b>config.js</b> com os dados do projeto Firebase.</p>`;return}
  fb=firebase.initializeApp(cfg);db=firebase.firestore();
  try{db.settings({experimentalAutoDetectLongPolling:true,ignoreUndefinedProperties:true,merge:true})}catch(e){}
  try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
  window.addEventListener('online',()=>setSync('ok','Salvo na nuvem'));window.addEventListener('offline',()=>setSync('local','Sem internet: salvo no aparelho'));
  firebase.auth().onAuthStateChanged(async u=>{
    subs.forEach(f=>f());subs=[];
    if(!u){sessao=null;canWrite=false;acessoOk=false;renderGate();
      try{const s=await db.doc('sistema/inicial').get();INICIADO=s.exists}catch(e){INICIADO=true}acessoOk=true;renderGate();return}
    let perfil=null;try{const s=await db.collection('usuarios').doc(u.uid).get();perfil=s.exists?s.data():null}catch(e){}
    if(!perfil||perfil.ativo==='Não'){await firebase.auth().signOut();acessoOk=true;renderGate(perfil?'Este usuário está bloqueado.':'Este e-mail não tem acesso ao sistema. Peça ao administrador para cadastrar você.');return}
    sessao={u:u.uid,nome:perfil.nome||u.email,papel:perfil.papel,email:u.email};serverWrite=sessao.papel==='admin';serverAdmin=serverWrite;
    setSync(navigator.onLine===false?'local':'ok',navigator.onLine===false?'Sem internet: salvo no aparelho':'Salvo na nuvem');
    subs.push(db.collection('usuarios').onSnapshot(s=>{S.acesso=s.docs.map(x=>({id:x.id,...x.data()}));onAcesso()},()=>{}));
    COLS.forEach(col=>subs.push(db.collection(col).onSnapshot(s=>{S[col]=s.docs.map(x=>({id:x.id,...x.data()}));loaded.add(col);schedule()},e=>showBanner('Não consegui ler os dados ('+e.code+'). Recarregue a página.'))));
    subs.push(db.doc('config/geral').onSnapshot(s=>{if(s.exists)CFG={...CFG,...s.data()};loaded.add('cfg');schedule()},()=>{}));
    entrar()})}

function openForm(col,rec,preset){
  const sc=SCH[col];cur={col,id:rec?.id||null,ex:rec?.exemplo};
  document.getElementById('dlgT').textContent=(rec?'Editar ':'Novo: ')+sc.t.toLowerCase().replace(/^./,m=>m.toUpperCase());
  const v={...(preset||{}),...(rec||{})};
  document.getElementById('dlgB').innerHTML=sc.f.map(f=>{const id='f_'+f.k;let val=v[f.k]??'';
    if(f.type==='num'&&val!=='')val=String(val).replace('.',',');
    if(f.type==='date'&&!val&&f.req)val=hoje();
    if(f.k==='usuario'&&rec)val=rec.email||'';
    if(f.type==='pass')val='';
    let inp;
    if(f.type==='pass'){inp=`<input id="${id}" name="${f.k}" type="password" autocomplete="new-password">`}else
    if(f.type==='select'){const o=typeof f.opts==='function'?f.opts():f.opts;inp=`<select id="${id}" name="${f.k}">${o.map(x=>{const[k,l]=Array.isArray(x)?x:[x,x];return`<option value="${esc(k)}"${String(k)===String(val)?' selected':''}>${esc(l)}</option>`}).join('')}</select>`}
    else if(f.type==='area')inp=`<textarea id="${id}" name="${f.k}" rows="2">${esc(val)}</textarea>`;
    else{const lst=f.list?(typeof f.list==='function'?f.list():f.list):null;
      inp=`<input id="${id}" name="${f.k}" ${f.type==='date'?'type="date"':f.type==='num'?'type="text" inputmode="decimal" autocomplete="off"':'type="text"'} value="${esc(val)}"${lst?` list="${id}_l"`:''}${f.req?' required':''}${f.lock&&rec?' readonly':''}${f.k==='usuario'?' autocapitalize="none" autocomplete="off"':''}>`+(lst?`<datalist id="${id}_l">${lst.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:'')}
    return`<div class="fld${f.half?' half':''}"><label for="${id}">${esc(f.l)}${f.req?' *':''}</label>${inp}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`}).join('')+(sc.calc?'<div class="calc" id="calcBox" hidden></div>':'');

  document.getElementById('dlgMeta').textContent=rec&&rec.em?`Última alteração: ${rec.porNome||rec.por||'—'} em ${fd(rec.em.slice(0,10))}`:'';
  document.getElementById('dlgS').disabled=!canWrite;
  updCalc();dlg.showModal();
}

async function salvarUsuario(o,err){
  const antes=cur.id?S.acesso.find(a=>a.id===cur.id):null;
  const perdeAdmin=antes&&antes.papel==='admin'&&antes.ativo!=='Não'&&(o.papel!=='admin'||o.ativo==='Não');
  if(perdeAdmin&&admins().length<=1){err.textContent='É preciso ter pelo menos um administrador liberado.';return false}
  if(antes){await put('acesso',{...antes,nome:o.nome.trim(),papel:o.papel,ativo:o.ativo||'Sim'});
    if(o.senha){err.textContent='A senha não muda por aqui. Use "Enviar link de nova senha".';return false}return true}
  const mail=(o.usuario||'').trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){err.textContent='Informe um e-mail válido.';return false}
  if(!o.senha||o.senha.length<6){err.textContent='Defina uma senha inicial com pelo menos 6 caracteres.';return false}
  if(o.senha!==o.senha2){err.textContent='As senhas não conferem.';return false}
  /* Um segundo app do Firebase cria a conta sem desconectar o administrador */
  const sec=firebase.apps.find(a=>a.name==='cadastro')||firebase.initializeApp(window.FIREBASE_CONFIG,'cadastro');
  let novo;try{novo=await sec.auth().createUserWithEmailAndPassword(mail,o.senha)}catch(x){err.textContent=msgAuth(x);return false}
  await sec.auth().signOut();
  await put('acesso',{id:novo.user.uid,nome:o.nome.trim(),email:mail,papel:o.papel,ativo:o.ativo||'Sim',criadoEm:new Date().toISOString()});return true}

  if(cur.col==='pcs'&&o.status==='Pago'&&!o.dataPagamento)o.dataPagamento=hoje();
  if(cur.ex)o.exemplo=true;
  const b=document.getElementById('dlgS');b.disabled=true;b.textContent='Salvando…';
  try{await put(cur.col,{id:cur.id,...o});dlg.close()}catch(x){err.textContent=x.code==='permission-denied'?'Sem permissão para salvar.':'Não salvou ('+(x.code||'erro')+'). Tente de novo.'}
  b.disabled=false;b.textContent='Salvar'});

async function exportar(col){const sc=SCH[col];const tp=f=>f.type==='num'?(/valor|R\$/i.test(f.l)?'brl':'num'):f.type==='date'?'date':'txt';
  const fs=sc.f.filter(f=>f.type!=='pass');

  const rows=S[col].filter(r=>!r.data||inAno(r.data)).map(r=>fs.map(f=>val(f,r)));

const head=(t,p,col,extra='')=>`<div class="sec-h"><div><h2>${t}</h2>${p?`<p>${p}</p>`:''}</div><div class="btns">${extra}${col&&dl&&col!=='acesso'?`<button class="btn" data-exp="${col}">Exportar planilha</button>`:''}${col&&canWrite?`<button class="btn pri" data-new="${col}">${col==='acesso'?'+ Novo usuário':'+ Lançar'}</button>`:''}</div></div>`;

const byDate=k=>(a,b)=>String(b[k]||'').localeCompare(String(a[k]||''));
function stockTable(est,attr,usoLabel){if(!est.length)return`<div class="tbl"><div class="empty">Nenhum item em estoque ainda. Lance uma entrada ou importe o XML da nota de compra.</div></div>`;
  return`<div class="tbl"><table><thead><tr><th>Item</th><th class="n">Entradas</th><th class="n">Saídas</th><th class="n">${usoLabel}</th><th class="n">Ajustes</th><th class="n">Saldo</th><th class="n">Mínimo</th><th>Situação</th></tr></thead><tbody>${est.map(e=>{const u=e.un?' '+esc(e.un):'';return`<tr><td>${esc(e.item)}</td><td class="n">${num(e.ent)}</td><td class="n">${num(e.sai)}</td><td class="n">${num(e.uso)}</td><td class="n">${num(e.aj)}</td><td class="n"><b>${num(e.saldo)}${u}</b></td><td class="n">${canWrite?`<input aria-label="Mínimo de ${esc(e.item)}" data-${attr==='min'?'min':'min-ins'}="${esc(e.item)}" value="${e.min||''}" inputmode="decimal" style="width:80px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);text-align:right">`:num(e.min)}</td><td>${e.saldo<0?'<span class="pill bad">Negativo</span>':e.min&&e.saldo<=e.min?'<span class="pill bad">Comprar</span>':'<span class="pill ok">Ok</span>'}</td></tr>`}).join('')}</tbody></table></div>`}

function chartMensal(){
  const m={};const add=(d,k,v)=>{if(!d||!inAno(d))return;const key=d.slice(0,7);(m[key]||(m[key]={r:0,c:0}))[k]+=v};
  S.pcs.forEach(p=>add(pcData(p),'r',pc(p).receita));S.custos.forEach(c=>add(c.data,'c',+c.valor||0));
  let keys=Object.keys(m).sort();if(ano==='todos')keys=keys.slice(-12);
  if(!keys.length)return'<div class="empty">Sem movimento no período.</div>';
  const max=Math.max(...keys.flatMap(k=>[m[k].r,m[k].c]),1);
  const step=Math.pow(10,Math.floor(Math.log10(max)));const nice=[1,2,2.5,5,10].map(x=>x*step).find(x=>x*4>=max)||step*10;const top=nice*4;
  const W=640,H=240,L=64,B=28,T=10,pw=W-L-12,ph=H-B-T,gw=pw/keys.length,bw=Math.min(26,gw*0.34);
  const y=v=>T+ph-(v/top)*ph;
  let g='';for(let i=0;i<=4;i++){const v=nice*i;g+=`<line x1="${L}" x2="${W-12}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>=1000?num(v/1000)+' mil':num(v)}</text>`}
  keys.forEach((k,i)=>{const cx=L+gw*i+gw/2;
    g+=`<rect x="${cx-bw-2}" y="${y(m[k].r)}" width="${bw}" height="${T+ph-y(m[k].r)}" rx="3" fill="var(--leaf)"><title>${fm(k)} receita ${brl(m[k].r)}</title></rect>`;
    g+=`<rect x="${cx+2}" y="${y(m[k].c)}" width="${bw}" height="${T+ph-y(m[k].c)}" rx="3" fill="var(--grape)"><title>${fm(k)} custos ${brl(m[k].c)}</title></rect>`;
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${fm(k)}</text>`});
  return`<div class="legend"><span><i style="background:var(--leaf)"></i>Receita das PCs</span><span><i style="background:var(--grape)"></i>Custos</span></div><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Receita e custos por mês">${g}</svg></div>`}

function barras(items){if(!items.length)return'<div class="empty">Sem custos no período.</div>';const max=Math.max(...items.map(i=>i[1]),1);
  return`<div class="bars">${items.map(([l,v])=>`<div class="bar"><span class="lbl" title="${esc(l)}">${esc(l)}</span><span class="track"><span class="fill" style="width:${(v/max*100).toFixed(1)}%;display:block"></span></span><span class="num">${brl(v)}</span></div>`).join('')}</div>`}

function alertas(){const h=hoje(),l=addDias(h,7),out=[];
  const T=titulos(),ap=T.filter(t=>t.tipo==='pagar'&&t.st!=='Quitado'),ar=T.filter(t=>t.tipo==='receber'&&t.st!=='Quitado');
  const venc=ap.filter(t=>t.vencido), prox=ap.filter(t=>t.venc&&t.venc>=h&&t.venc<=l);
  if(venc.length)out.push(['bad','Vencida',`${venc.length} conta(s) a pagar atrasada(s), somando <b>${brl(sum(venc,t=>t.saldo))}</b>.`,'financeiro']);
  if(prox.length)out.push(['warn','7 dias',`${prox.length} conta(s) vencem nesta semana: <b>${brl(sum(prox,t=>t.saldo))}</b>.`,'financeiro']);
  if(ar.length)out.push([ar.some(t=>t.vencido)?'bad':'warn','A receber',`${ar.length} título(s) a receber, somando <b>${brl(sum(ar,t=>t.saldo))}</b>${ar.some(t=>t.vencido)?', com atraso':''}.`,'financeiro']);
  const pendEx=S.extrato.filter(x=>!x.match&&!x.ignorado).length;if(pendEx)out.push(['warn','Conciliar',`${pendEx} lançamento(s) do extrato bancário sem conciliar.`,'financeiro']);
  if(sessao?.papel==='admin'&&(!CFG.ultimoBackup||CFG.ultimoBackup<addDias(h,-7)))out.push(['warn','Backup',CFG.ultimoBackup?`Último backup em ${fd(CFG.ultimoBackup)}. Faça um novo.`:'Nenhum backup baixado ainda.','ajustes']);
  carencias().forEach(c=>out.push(['bad','Carência',`<b>${esc(c.t.nome)}</b> não pode ser colhido até <b>${fd(c.lib)}</b> (${esc(prodsPulv(c.p))}).`,'pulverizacoes']));
  const bx=[...estoque(),...estoqueIns()].filter(e=>e.min&&e.saldo<=e.min);bx.forEach(e=>out.push(['bad','Estoque',`${esc(e.item)}: restam <b>${num(e.saldo)}${e.un?' '+esc(e.un):''}</b> (mínimo ${num(e.min)}).`,'embalagens']));
  const semPC=S.envios.filter(e=>e.data&&e.data<addDias(h,-14)&&!S.pcs.some(p=>p.dataFim&&p.dataInicio&&e.data>=p.dataInicio&&e.data<=p.dataFim));
  if(semPC.length)out.push(['warn','Conferir',`${semPC.length} envio(s) de uva com mais de 14 dias sem PC lançada para o período.`,'pcs']);
  if(!out.length)out.push(['ok','Tudo certo','Nenhuma conta atrasada, nenhum estoque baixo.','']);
  return`<div class="alerts">${out.map(([c,t,x,go])=>`<div class="alert ${c}"><b class="tag">${t}</b><span>${x}${go?` <button class="btn sm" data-go="${go}">Ver</button>`:''}</span></div>`).join('')}</div>`}

 envios(){const R=resumo();const rows=[...R.es].sort(byDate('data'));

 custos(){const R=resumo();const rows=[...R.cs].sort(byDate('data'));const nx=[...S.notasxml].filter(n=>inAno(n.data)).sort(byDate('data'));

  <section class="sec"><div class="sec-h"><div><h2>Notas importadas por XML</h2><p>Cada XML importado uma vez só (pela chave de acesso). "Desfazer" apaga a nota e tudo que ela gerou: custo, estoque e envio de uva.</p></div></div>

 embalagens(){const rowsE=[...S.embalagens].filter(e=>inAno(e.data)).sort(byDate('data'));const rowsI=[...S.insumos].filter(e=>inAno(e.data)).sort(byDate('data'));

 producao(){const rows=[...S.producao].filter(p=>inAno(p.data)).sort(byDate('data'));
  const g={};rows.forEach(p=>{const k=p.pessoa||'';const r=g[k]||(g[k]={id:k,cx:0,dias:new Set(),pagar:0});r.cx+=+p.caixas||0;r.dias.add(p.data);r.pagar+=(+p.caixas||0)*(+p.valorCaixa||0)});

  <div class="kpis">${kpi('Caixas embaladas',int(tot),dias+' dia(s) de packing')}${kpi('Média por dia',dias?int(tot/dias)+' cx':'—','Equipe toda')}${kpi('Embaladeiras',rk.length,'com produção no período')}${kpi('A pagar por produção',brl(sum(rows,p=>(+p.caixas||0)*(+p.valorCaixa||0))))}</div>
  <section class="sec"><h3>Ranking</h3>${table(null,[{h:'#',n:1,v:r=>rk.indexOf(r)+1},{h:'Embaladeira',v:r=>esc(pNome(r.id))},{h:'Dias',n:1,v:r=>r.nd},{h:'Caixas',n:1,v:r=>`<b>${int(r.cx)}</b>`},{h:'Média por dia',n:1,v:r=>int(r.media)},{h:'Participação',n:1,v:r=>tot?num(r.cx/tot*100)+'%':'—'},{h:'A pagar',n:1,v:r=>brl(r.pagar)}],rk)}</section>
  <section class="sec"><h3>Lançamentos</h3>${table('producao',[{h:'Data',v:r=>fd(r.data)+ex(r)},{h:'Embaladeira',v:r=>esc(pNome(r.pessoa))},{h:'Lote',v:r=>esc(r.talhao?tNome(r.talhao):'—')},{h:'Caixa',v:r=>esc(r.embalagem||'—')},{h:'Caixas',n:1,v:r=>int(r.caixas)},{h:'R$/cx',n:1,v:r=>r.valorCaixa?brl(r.valorCaixa):'—'}],rows,['Total','','','',int(tot),''])}</section>
  <p class="note">A produção por embaladeira mede o trabalho. Ela não mexe no estoque de caixas: quem baixa as caixas do estoque é o envio da uva.</p>`},

 pulverizacoes(){const rows=[...S.pulverizacoes].filter(p=>inAno(p.data)).sort(byDate('data'));
  const g={};rows.forEach(p=>{const k=p.tratorista||'';const r=g[k]||(g[k]={id:k,n:0,ha:0,h:0,l:0});r.n++;r.ha+=+p.area||0;r.h+=+p.horas||0;r.l+=+p.calda||0});

  const cons={};rows.forEach(p=>[[p.produto1,p.qtd1],[p.produto2,p.qtd2],[p.produto3,p.qtd3]].forEach(([k,q])=>{if(k)cons[k]=(cons[k]||0)+(+q||0)}));
  const unI=Object.fromEntries(estoqueIns().map(e=>[e.item,e]));

  <section class="sec"><h3>Consumo de produtos</h3>${table(null,[{h:'Produto',v:r=>esc(r[0])},{h:'Usado',n:1,v:r=>num(r[1])+' '+esc(unI[r[0]]?.un||'')},{h:'Saldo em estoque',n:1,v:r=>unI[r[0]]?`<span class="${unI[r[0]].saldo<0?'neg':''}">${num(unI[r[0]].saldo)} ${esc(unI[r[0]].un||'')}</span>`:'<span class="pill warn">Sem cadastro</span>'}],Object.entries(cons).sort((a,b)=>b[1]-a[1]))}</section>
  </div>
  <section class="sec"><h3>Aplicações</h3>${table('pulverizacoes',[{h:'Data',v:r=>fd(r.data)+ex(r)},{h:'Tratorista',v:r=>esc(pNome(r.tratorista))},{h:'Lote',v:r=>esc(tNome(r.talhao))},{h:'Alvo',v:r=>esc(r.alvo||'—')},{h:'Produtos',w:1,v:r=>esc(prodsPulv(r))},{h:'Área',n:1,v:r=>num(r.area)+' ha'},{h:'Calda',n:1,v:r=>int(r.calda)+' L'},{h:'Liberação',v:r=>+r.carencia?(addDias(r.data,+r.carencia)>hoje()?`<span class="pill bad">${fd(addDias(r.data,+r.carencia))}</span>`:`<span class="pill ok">${fd(addDias(r.data,+r.carencia))}</span>`):'—'}],rows)}</section>`},

 financeiro(){const T=titulos(),h=hoje();const pag=T.filter(t=>t.tipo==='pagar'),rec=T.filter(t=>t.tipo==='receber');const ab=a=>a.filter(t=>t.st!=='Quitado');
  const FT=[['pagar','Contas a pagar'],['receber','Contas a receber'],['fluxo','Fluxo de caixa'],['conc','Conciliação bancária'],['contas','Contas bancárias']];
  const kp=`<div class="kpis">${kpi('Saldo em contas hoje',brl(caixaHoje()),contasB().length+' conta(s)',caixaHoje()<0?'neg':'')}${kpi('A receber',brl(sum(ab(rec),t=>t.saldo)),ab(rec).length+' título(s)')}${kpi('A pagar',brl(sum(ab(pag),t=>t.saldo)),ab(pag).length+' título(s)')}${kpi('Vencido a pagar',brl(sum(pag.filter(t=>t.vencido),t=>t.saldo)),'',pag.some(t=>t.vencido)?'neg':'')}${kpi('Vencido a receber',brl(sum(rec.filter(t=>t.vencido),t=>t.saldo)),'',rec.some(t=>t.vencido)?'neg':'')}</div>`;
  const nav=`<div class="tabs-in" role="tablist" style="border-bottom:1px solid var(--line)">${FT.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${finTab===k}" data-fin="${k}">${l}</button>`).join('')}</div>`;
  let body='';
  if(finTab==='pagar'||finTab==='receber'){const pg=finTab==='pagar';let L=pg?pag:rec;
    if(finFiltro==='abertas')L=ab(L);else if(finFiltro==='vencidas')L=L.filter(t=>t.vencido);else if(finFiltro==='quitadas')L=L.filter(t=>t.st==='Quitado'&&inAno(t.venc));else L=L.filter(t=>t.st!=='Quitado'||inAno(t.venc));
    L=[...L].sort((a,b)=>String(a.venc).localeCompare(String(b.venc)));
    const pill=t=>t.st==='Quitado'?'<span class="pill ok">Quitado</span>':t.vencido?'<span class="pill bad">Vencido</span>':t.st==='Parcial'?'<span class="pill warn">Parcial</span>':'<span class="pill">Em aberto</span>';
    body=`<div class="sec-h"><div><h2>${pg?'Contas a pagar':'Contas a receber'}</h2><p>${pg?'Notas e custos a prazo e contas avulsas. Use Baixar para registrar o pagamento, inclusive parcial, com juros ou desconto.':'PCs da Valexfruit e outras entradas previstas. Use Baixar quando o dinheiro cair na conta.'}</p></div>
    <div class="btns"><label class="sync" for="finFiltro">Mostrar</label><select id="finFiltro" class="yr">${optsH([['abertas','Em aberto'],['vencidas','Vencidas'],['quitadas','Quitadas'],['todas','Todas']],finFiltro)}</select>${canWrite?`<button class="btn pri" data-new="movfin" data-tipo="${pg?'Saída':'Entrada'}">+ ${pg?'Conta a pagar':'Conta a receber'}</button>`:''}</div></div>
    ${L.length?`<div class="tbl"><table><thead><tr><th>Vencimento</th><th>Descrição</th><th>${pg?'Fornecedor':'Cliente'}</th><th>Origem</th><th class="n">Valor</th><th class="n">${pg?'Pago':'Recebido'}</th><th class="n">Saldo</th><th>Situação</th><th></th></tr></thead><tbody>${L.map(t=>`<tr><td class="${t.vencido?'neg':''}">${fd(t.venc)}</td><td class="wrap">${esc(t.desc)}${ex(t.r)}</td><td>${esc(t.parte||'—')}</td><td><span class="pill">${esc(t.origem)}</span></td><td class="n">${brl(t.valor)}</td><td class="n">${brl(t.pago)}</td><td class="n"><b>${brl(t.saldo)}</b></td><td>${pill(t)}</td><td><button class="btn sm${t.st!=='Quitado'&&canWrite?' pri':''}" data-baixa="${t.col}|${t.id}">${t.st!=='Quitado'&&canWrite?'Baixar':'Ver baixas'}</button></td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td></td><td></td><td></td><td class="n">${brl(sum(L,t=>t.valor))}</td><td class="n">${brl(sum(L,t=>t.pago))}</td><td class="n">${brl(sum(L,t=>t.saldo))}</td><td></td><td></td></tr></tfoot></table></div>`:`<div class="tbl"><div class="empty">Nenhum título ${finFiltro==='abertas'?'em aberto':'neste filtro'}.</div></div>`}`}
  else if(finTab==='fluxo'){const mv=movimentos();const cc=conciliados();const mm={};mv.filter(m=>m.data).forEach(m=>{const k=m.data.slice(0,7);(mm[k]||(mm[k]={e:0,s:0}));m.valor>0?mm[k].e+=m.valor:mm[k].s-=m.valor});
    let acc=sum(contasB(),c=>+c.saldoInicial||0);const fl=Object.keys(mm).sort().map(k=>{acc+=mm[k].e-mm[k].s;return{k,...mm[k],saldo:acc}}).filter(r=>inAno(r.k)).reverse();
    const lst=mv.filter(m=>inAno(m.data)).sort((a,b)=>b.data.localeCompare(a.data));
    body=`<div class="grid2"><section class="sec"><h3>Por mês</h3>${table(null,[{h:'Mês',v:r=>fm(r.k)},{h:'Entrou',n:1,v:r=>`<span class="pos">${brl(r.e)}</span>`},{h:'Saiu',n:1,v:r=>`<span class="neg">${brl(r.s)}</span>`},{h:'Saldo no fim',n:1,v:r=>`<b>${brl(r.saldo)}</b>`}],fl)}</section>
    <section class="sec"><h3>Saldo por conta</h3>${table(null,[{h:'Conta',v:c=>esc(c.nome)},{h:'Saldo hoje',n:1,v:c=>`<b>${brl(saldoConta(c.id,h))}</b>`}],contasB())}</section></div>
    <section class="sec"><h3>Movimentos ${periodo().toLowerCase()}</h3>${table(null,[{h:'Data',v:m=>fd(m.data)},{h:'Conta',v:m=>esc(contaNome(m.conta))},{h:'Descrição',w:1,v:m=>esc(m.t.desc)},{h:'Origem',v:m=>esc(m.t.origem)},{h:'Forma',v:m=>esc(m.b.forma||'—')},{h:'Valor',n:1,v:m=>`<span class="${m.valor<0?'neg':'pos'}">${brl(m.valor)}</span>`},{h:'Extrato',v:m=>cc.has(m.key)?'<span class="pill ok">Conciliado</span>':'<span class="pill">Pendente</span>'}],lst)}</section>`}
  else if(finTab==='conc'){const cs=contasB();if(!cs.some(c=>c.id===concConta))concConta=cs[0].id;
    const ex=S.extrato.filter(x=>x.conta===concConta&&inAno(x.data)).sort((a,b)=>b.data.localeCompare(a.data));const pend=ex.filter(x=>!x.match&&!x.ignorado);
    const xs=(CFG.extratoSaldo||{})[concConta];const sis=xs?saldoConta(concConta,xs.data):null;const dif=xs?xs.saldo-sis:null;
    const cc=conciliados();const ds=ex.map(x=>x.data).sort();const soSis=ds.length?movimentos().filter(m=>m.conta===concConta&&m.data>=ds[0]&&m.data<=ds[ds.length-1]&&!cc.has(m.key)):[];

function parseNFe(txt,fname){
  const d=new DOMParser().parseFromString(txt,'application/xml');
  if(d.getElementsByTagName('parsererror').length)throw new Error('não é um XML válido');
  const inf=d.getElementsByTagName('infNFe')[0];if(!inf)throw new Error('não é XML de NF-e');
  const ide=inf.getElementsByTagName('ide')[0],emit=inf.getElementsByTagName('emit')[0],dest=inf.getElementsByTagName('dest')[0];
  const chave=(tx(d,'chNFe')||(inf.getAttribute('Id')||'').replace(/^NFe/,'')).replace(/\D/g,'');
  const docE=(tx(emit,'CNPJ')||tx(emit,'CPF')).replace(/\D/g,''),docD=(tx(dest,'CNPJ')||tx(dest,'CPF')).replace(/\D/g,'');
  const tpNF=tx(ide,'tpNF'),data=(tx(ide,'dhEmi')||tx(ide,'dEmi')).slice(0,10);
  const itens=Array.from(inf.getElementsByTagName('det')).map(det=>{const p=det.getElementsByTagName('prod')[0];return{cProd:tx(p,'cProd'),xProd:tx(p,'xProd'),ncm:tx(p,'NCM'),cfop:tx(p,'CFOP'),un:tx(p,'uCom'),q:+tx(p,'qCom')||0,v:+tx(p,'vProd')||0}});
  const vNF=+tx(inf.getElementsByTagName('ICMSTot')[0],'vNF')||sum(itens,i=>i.v);
  const dups=Array.from(inf.getElementsByTagName('dup')).map(x=>tx(x,'dVenc')).filter(Boolean).sort();
  const meu=(CFG.docProdutor||'').replace(/\D/g,'');let tipo,conf='ok';
  /* tpNF 1 = nota de saída do emitente; 0 = nota de entrada do emitente (ex.: a cooperativa recebendo a uva do cooperado) */
  if(meu&&docD===meu)tipo=tpNF==='0'?'Saída':'Entrada';
  else if(meu&&docE===meu)tipo=tpNF==='0'?'Entrada':'Saída';
  else{tipo=tpNF==='0'?'Saída':'Entrada';conf=meu?'outro':'semdoc'}
  const contra=docE===meu?docD:docE;
  return{chave:chave||uid(),numero:tx(ide,'nNF'),serie:tx(ide,'serie'),data,tpNF,natOp:tx(ide,'natOp'),emitente:tx(emit,'xNome'),docE,destinatario:tx(dest,'xNome'),docD,contra,vNF,itens,venc:dups[0]||'',nParc:dups.length,tipo,conf,fname}}
const mapKey=(n,it)=>(n.contra||'x')+'_'+String(it.cProd||it.xProd).replace(/[^A-Za-z0-9_-]/g,'').slice(0,40);
function palpite(n,it){const m=(CFG.mapaXml||{})[mapKey(n,it)];if(m)return m;
  const ncm=it.ncm||'',x=(it.xProd||'').toUpperCase();let d='nada';
  if(/^0806/.test(ncm)||/\bUVAS?\b/.test(x))d='uva';
  else if(/^(4819|4821|3923|3920|3921|4808|4823|5608)/.test(ncm)||/CAIXA|CUMBUCA|SACOLA|LONA|ETIQUETA|EMBALAGEM|BANDEJA|CLAMSHELL|FILME|PALLET|PALETE/.test(x))d='emb';
  else if(/^(3808|310[1-5]|2833|2834|2835|3824)/.test(ncm)||/FUNGIC|INSETIC|HERBIC|ACARIC|ADUBO|FERTIL|FOLIAR|ENXOFRE|CALCARIO|NITRATO|SULFATO/.test(x))d='ins';
  return{d,n:it.xProd}}
function catPalpite(n){const ns=n.itens.map(i=>i.ncm||'');if(ns.some(x=>/^3808/.test(x)))return'Defensivos';if(ns.some(x=>/^310/.test(x)))return'Fertilizantes e adubos';
  const ds=n.itens.map(i=>palpite(n,i).d);if(ds.length&&ds.every(d=>d==='emb'))return/LONA/i.test(n.itens.map(i=>i.xProd).join(' '))?'Lona e cobertura':'Embalagens';return'Outros'}

function legado(col,r){if(r.baixas&&r.baixas.length)return null;

function titulo(col,r){if(!r)return null;let tipo,valor,venc,desc,parte,origem;
  if(col==='custos'){if(r.forma==='Descontado na PC')return null;tipo='pagar';valor=+r.valor||0;venc=r.vencimento||r.data;desc=r.descricao;parte=r.fornecedor||'';origem=r.nota?'NF '+r.nota:'Custo'}

  const amort=sum(bx,b=>(+b.valor||0)-(+b.juros||0)+(+b.desconto||0)),saldo=Math.max(0,valor-amort);
  const st=saldo<=EPS?'Quitado':amort>EPS?'Parcial':'Aberto';

function parseOFX(t){const get=(b,tag)=>{const m=b.match(new RegExp('<'+tag+'>([^<\\r\\n]*)','i'));return m?m[1].trim():''};
  const dt=s=>s&&s.length>=8?s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8):'';

function candidatos(l){const conc=conciliados(),sinal=l.valor>0?1:-1,abs=Math.abs(l.valor);
  const ms=movimentos().filter(m=>!conc.has(m.key)&&Math.sign(m.valor)===sinal&&m.conta===l.conta&&Math.abs(Math.abs(m.valor)-abs)<0.01).sort((a,b)=>Math.abs(new Date(a.data)-new Date(l.data))-Math.abs(new Date(b.data)-new Date(l.data)));

async function aplicarConc(l,op){if(op==='ign'){await rawSet('extrato',{...l,ignorado:true});return}
  if(op==='novo'){const id=uid(),bid=uid();await put('movfin',{id,data:l.data,tipo:l.valor>0?'Entrada':'Saída',descricao:l.desc||'Lançamento do extrato',valor:Math.abs(l.valor),situacao:'Realizado',conta:l.conta,baixas:[{id:bid,data:l.data,valor:Math.abs(l.valor),juros:0,desconto:0,conta:l.conta,forma:'Extrato',por:sessao?.nome||''}]});await rawSet('extrato',{...l,match:'movfin/'+id+'/'+bid});return}
  if(op.startsWith('m:')){await rawSet('extrato',{...l,match:op.slice(2)});return}
  if(op.startsWith('t:')){const[col,id]=op.slice(2).split('/');const r=S[col].find(x=>x.id===id);const t=titulo(col,r);const abs=Math.abs(l.valor);
    const juros=abs>t.saldo+EPS?Math.round((abs-t.saldo)*100)/100:0;const nb={id:uid(),data:l.data,valor:abs,juros,desconto:0,conta:l.conta,forma:'Extrato',obs:l.desc,por:sessao?.nome||''};
    await put(col,{...r,...syncLegado(col,r,[...(r.baixas||[]),nb])});await rawSet('extrato',{...l,match:col+'/'+id+'/'+nb.id})}}
async function autoConc(btn){btn.disabled=true;btn.textContent='Conciliando…';let n=0;
  for(const l of S.extrato.filter(x=>x.conta===concConta&&!x.match&&!x.ignorado)){const{ms,ts}=candidatos(l);
    const m=ms.find(m=>Math.abs(new Date(m.data)-new Date(l.data))<=5*864e5);
    if(m){await aplicarConc(l,'m:'+m.key);n++;continue}
    const iguais=ts.filter(t=>Math.abs(t.saldo-Math.abs(l.valor))<0.01);if(iguais.length===1){await aplicarConc(l,'t:'+iguais[0].col+'/'+iguais[0].id);n++}}
  showBanner(n?`${n} lançamento(s) conciliados automaticamente. Confira os pendentes.`:'Nenhuma correspondência automática encontrada. Concilie os pendentes um a um.');render()}

const TODAS=()=>[...COLS];
async function backup(btn){btn.disabled=true;const data={app:'fazenda-romulo',versao:2,geradoEm:new Date().toISOString(),por:sessao?.nome||'',config:CFG,colecoes:{}};TODAS().forEach(c=>data.colecoes[c]=S[c]);
  const ok=await salvarArquivo('backup-fazenda-'+hoje()+'.json',new Blob([JSON.stringify(data)],{type:'application/json'}));if(ok)try{await putCfg({ultimoBackup:hoje()})}catch(e){}btn.disabled=false}
let RESTORE=null;
function abrirRestore(j,nome){RESTORE=j;impF.dataset.mode='restore';document.getElementById('impT').textContent='Restaurar backup';document.getElementById('impS').textContent='Restaurar';document.getElementById('impS').disabled=false;document.getElementById('impErr').textContent='';
  const cs=Object.entries(j.colecoes||{}).filter(([c,a])=>TODAS().includes(c)&&Array.isArray(a)&&a.length);
  impB.innerHTML=`<p class="note">${esc(nome)} · gerado em ${fd((j.geradoEm||'').slice(0,10))}${j.por?' por '+esc(j.por):''}</p>
   <div class="tbl"><table><thead><tr><th>O que</th><th class="n">Registros</th></tr></thead><tbody>${cs.map(([c,a])=>`<tr><td>${esc(c)}</td><td class="n">${a.length}</td></tr>`).join('')}</tbody></table></div>
   <p class="note">Os registros do backup são gravados de volta. Os que têm o mesmo código são substituídos pela versão do backup; nada que foi lançado depois é apagado. Usuários e senhas não fazem parte do backup: eles ficam no login do Firebase.</p><p class="note" id="rs_prog"></p>`;imp.showModal()}
async function salvarRestore(err){const j=RESTORE,p=document.getElementById('rs_prog');let n=0;
  for(const c of TODAS()){if(c==='acesso')continue;for(const d of (j.colecoes||{})[c]||[]){if(!d||!d.id)continue;await rawSet(c,d);n++;if(n%20===0)p.textContent=n+' registros restaurados…'}}
  if(j.config)await putCfg(j.config);showBanner(n+' registros restaurados do backup.');return true}
const MODOS={baixa:salvarBaixa,ofx:salvarOFX,restore:salvarRestore};
document.getElementById('ofxIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{abrirOFX(parseOFX(await f.text()),f.name)}catch(x){showBanner('Extrato não importado: '+x.message)}});
document.getElementById('bkIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text());if(j.app!=='fazenda-romulo'||!j.colecoes)throw new Error('este arquivo não é um backup deste sistema');abrirRestore(j,f.name)}catch(x){showBanner('Backup não lido: '+x.message)}});
init();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
